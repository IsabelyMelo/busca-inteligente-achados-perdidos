[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "busca-inteligente-achados-perdidos"
version = "0.1.0"
description = "API de recuperação e ranqueamento textual de itens encontrados."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "numpy>=2.0,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pymysql>=1.1,<2.0",
    "rapidfuzz>=3.10,<4.0",
    "scikit-learn>=1.5,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

